name: Update Subscriptions

on:
  schedule:
    # 每天北京时间 04:09 → UTC 20:09
    - cron: '9 20 * * *'
  workflow_dispatch:   # 保留这个方便手动触发测试

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: write
    env:
      HAS_PRIVATE_PAT: ${{ secrets.PRIVATE_REPO_PAT != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Real-Prober and Classifier (sing-box v1.14 全协议)
        run: |
          python scripts/main_v2.py
        env:
          # 便于 ip-api 等识别限速; GitHub runner 出口为美国 Azure
          PYTHONUNBUFFERED: '1'
          # v3.9 私有源（地址只存 Secret，绝不写入仓库文件）
          PRIVATE_SOURCE_URLS: ${{ secrets.PRIVATE_SOURCE_URLS }}

      - name: Upload test artifacts (调试用, 7天保留)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: |
            output/e2e_test_report.json
          retention-days: 7
          if-no-files-found: ignore

      # 产出不再提交到公开仓库，改为同步到私库 clean-notes-sub
      - name: Checkout Private Repo
        if: env.HAS_PRIVATE_PAT == 'true'
        uses: actions/checkout@v4
        with:
          repository: jack197889/clean-notes-sub
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private-repo

      - name: Sync Outputs to Private Repo
        if: env.HAS_PRIVATE_PAT == 'true'
        run: |
          mkdir -p private-repo/outputs
          rsync -a --delete output/ private-repo/outputs/
          cp README.md private-repo/outputs/README.md
          cd private-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A outputs/
          if git diff --staged --quiet; then
            echo "私库产出无变动。"
          else
            git commit -m "Sync outputs: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi
